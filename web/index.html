<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ScopeDiff watches bug bounty scopes and tells hunters exactly what changed, before they waste a weekend."
    />
    <meta name="theme-color" content="#F7F6F3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ScopeDiff — know what changed before you test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("scopediff.theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ScopeDiff needs JavaScript to render the change feed.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
