name: ScopeDiff cron

on:
  schedule:
    # Free-plan practical cadence. GitHub may delay scheduled runs.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Process pending and due watches
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          H1_API_USER: ${{ secrets.H1_API_USER }}
          H1_API_TOKEN: ${{ secrets.H1_API_TOKEN }}
          GOOGLE_CLOUD_PROJECT: scopediff
          SCOPEDIFF_PUBLIC_URL: https://scopediff.web.app
        run: python scripts/firestore_cron.py
